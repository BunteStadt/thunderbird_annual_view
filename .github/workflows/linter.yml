name: Lint with webext-linter

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Install dependencies
        run: npm ci

      - name: Run webext-linter
        id: linter
        continue-on-error: true
        run: npm run lint:thunderbird

      - name: Publish lint feedback summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          json_report = Path("test-results/thunderbird-linter/linter-report.json")
          markdown_lines = ["## webext-linter feedback", ""]

          if not json_report.exists():
            markdown_lines.append("- No JSON lint report was generated.")
          else:
            report = json.loads(json_report.read_text(encoding="utf-8"))
            summary = report.get("summary", {})
            markdown_lines.append(
              f"- Errors: {summary.get('error', 0)} | Warnings: {summary.get('warning', 0)} | Info: {summary.get('info', 0)}"
            )
            findings = report.get("findings", [])
            if findings:
              markdown_lines.append("")
              markdown_lines.append("### Findings")
              for finding in findings:
                severity = str(finding.get("severity", "unknown")).upper()
                rule = finding.get("ruleId") or "unknown-rule"
                file_name = finding.get("file") or "unknown-file"
                loc = finding.get("loc") or {}
                line = loc.get("line", "?")
                message = finding.get("message") or finding.get("item") or "No message provided."
                markdown_lines.append(f"- **[{severity}]** `{rule}` in `{file_name}:{line}` — {message}")
            else:
              markdown_lines.append("- No findings reported.")

          summary_text = "\n".join(markdown_lines) + "\n"
          summary_path = Path("test-results/thunderbird-linter/linter-feedback-summary.md")
          summary_path.parent.mkdir(parents=True, exist_ok=True)
          summary_path.write_text(summary_text, encoding="utf-8")
          with summary_path.open("r", encoding="utf-8") as fh:
            print(fh.read())
          PY
          cat test-results/thunderbird-linter/linter-feedback-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload linter report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linter-report
          path: |
            test-results/thunderbird-linter/linter-report.txt
            test-results/thunderbird-linter/linter-report.json
            test-results/thunderbird-linter/linter-feedback-summary.md

      - name: Check linter exit code
        if: steps.linter.outcome == 'failure'
        run: |
          echo "::warning::webext-linter reported issues. See the uploaded linter report for details."
          exit 1
