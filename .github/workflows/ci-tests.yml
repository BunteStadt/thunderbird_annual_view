name: CI Tests

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  submodule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check submodule is up to date
        run: |
          submodule_path="src/hosts/thunderbird/submodules"
          git -C "$submodule_path" fetch --quiet origin main
          unpulled=$(git -C "$submodule_path" rev-list HEAD..origin/main --count)

          if [ "$unpulled" -gt 0 ]; then
            echo "The submodule has $unpulled unpulled commit(s):"
            git -C "$submodule_path" log --oneline --no-decorate HEAD..origin/main
            exit 1
          fi

          echo "Submodule is up to date."

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: node --test

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install prerequisites
        run: |
          sudo snap install thunderbird
          sudo apt-get install -y xvfb scrot xdotool

      - name: Run e2e test
        run: |
          chmod +x ./test/e2e/run-e2e-test.sh
          ./test/e2e/run-e2e-test.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/

  saas-browser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run credential-free SaaS browser smoke test
        run: npm run test:e2e:saas
